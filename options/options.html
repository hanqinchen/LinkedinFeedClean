<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings - LinkedIn Feed Categorizer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      max-width: 700px;
      margin: 60px auto;
      padding: 0 24px;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif;
      color: #1d1d1f;
      background:
        radial-gradient(circle at 20% 20%, rgba(255, 182, 193, 0.2) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(173, 216, 230, 0.2) 0%, transparent 50%),
        #fafafa;
      line-height: 1.5;
    }

    h1 {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.8px;
      margin-bottom: 40px;
      text-align: center;
    }

    .card {
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border-radius: 20px;
      padding: 28px;
      margin-bottom: 20px;
      box-shadow:
        0 10px 40px rgba(0, 0, 0, 0.06),
        0 0 0 1px rgba(255, 255, 255, 0.5) inset;
    }

    .card h2 {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.4px;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(0, 0, 0, 0.06);
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #86868b;
      margin-bottom: 8px;
      letter-spacing: 0.3px;
    }

    input[type="text"],
    input[type="password"],
    select {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: 12px;
      font-size: 15px;
      font-weight: 500;
      background: rgba(255, 255, 255, 0.8);
      box-sizing: border-box;
      transition: all 0.2s ease;
      color: #1d1d1f;
      font-family: inherit;
      margin-bottom: 16px;
    }

    input[type="text"]:focus,
    input[type="password"]:focus,
    select:focus {
      outline: none;
      border-color: #007AFF;
      box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.1);
      background: #fff;
    }

    select {
      cursor: pointer;
    }

    .btn {
      border: none;
      border-radius: 14px;
      cursor: pointer;
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s cubic-bezier(0.25, 0.1, 0.25, 1);
      font-family: inherit;
    }

    .btn-primary {
      background: linear-gradient(135deg, #007AFF 0%, #5856D6 100%);
      color: #fff;
      box-shadow: 0 4px 12px rgba(0, 122, 255, 0.3);
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(0, 122, 255, 0.4);
    }

    .btn-secondary {
      background: rgba(0, 0, 0, 0.05);
      color: #1d1d1f;
    }

    .btn-secondary:hover {
      background: rgba(0, 0, 0, 0.08);
    }

    .btn-row {
      display: flex;
      gap: 12px;
      margin-top: 8px;
      flex-wrap: wrap;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      color: #fff;
      padding: 12px 24px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 500;
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.25, 0.1, 0.25, 1);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .hint {
      font-size: 13px;
      color: #86868b;
      margin-top: -8px;
      margin-bottom: 16px;
      line-height: 1.4;
    }

    .hint a {
      color: #007AFF;
      text-decoration: none;
    }

    .hint a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h1>⚙️ LinkedIn Feed Categorizer</h1>

  <div class="card">
    <h2>🔑 Claude API Configuration</h2>
    <label for="api-key">API Key (for AI-powered smart categorization)</label>
    <input type="password" id="api-key" placeholder="sk-ant-api03-..." autocomplete="off" />
    <p class="hint">
      Get API Key: <a href="https://console.anthropic.com/" target="_blank">Anthropic Console</a>
    </p>
    <button id="btn-save-key" class="btn btn-primary">Save Settings</button>
  </div>

  <div class="card">
    <h2>🎛️ Filter Mode</h2>
    <label for="filter-mode">How to handle posts from non-categorized members</label>
    <select id="filter-mode">
      <option value="hide">Hide (don't show at all)</option>
      <option value="fade">Fade (reduce opacity)</option>
    </select>
  </div>

  <div class="card">
    <h2>💾 Data Management</h2>
    <div class="btn-row">
      <button id="btn-export" class="btn btn-secondary">Export Category Data</button>
      <button id="btn-import" class="btn btn-secondary">Import Category Data</button>
      <input type="file" id="file-import" accept=".json" style="display:none" />
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="../lib/storage.js"></script>
  <script src="options.js"></script>
</body>
</html>
