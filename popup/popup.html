<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinkedIn Feed Categorizer</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="header">
      <h1>Feed Categorizer</h1>
      <button id="btn-ai-suggest" class="btn btn-primary">✨ AI Sort</button>
    </header>

    <!-- Extension context invalidated warning -->
    <div id="context-invalid" class="hidden" style="padding: 20px; margin: 15px; text-align: center; background: #fff3cd; border-radius: 8px;">
      <p style="margin: 0 0 10px 0; color: #856404; font-weight: 500;">⚠️ Extension needs reload</p>
      <p style="margin: 0 0 15px 0; font-size: 13px; color: #856404;">Please refresh this extension at <code style="background: #ffeaa7; padding: 2px 6px; border-radius: 4px;">chrome://extensions/</code></p>
      <button onclick="location.reload()" class="btn btn-secondary" style="font-size: 13px;">Refresh Popup</button>
    </div>

    <!-- Category List View -->
    <div id="view-categories">
      <div class="section-header">
        <span>Categories</span>
        <button id="btn-add-category" class="btn btn-text">+ New Category</button>
      </div>
      <div id="category-list">
        <p class="empty-hint">No categories yet.<br>Click "+ New Category" to create your first one</p>
      </div>
    </div>

    <!-- New/Edit Category -->
    <div id="view-edit-category" class="hidden">
      <div class="section-header">
        <button class="btn btn-back btn-back-category">← Back</button>
        <span id="edit-category-title">New Category</span>
        <span></span>
      </div>
      <div class="form-group">
        <label>Category Name</label>
        <input type="text" id="input-category-name" placeholder="e.g., AI / SaaS" />
      </div>
      <div class="form-group">
        <label>Icon Emoji</label>
        <input type="text" id="input-category-icon" placeholder="🤖 🚀 💰 🎨" maxlength="2" />
      </div>
      <div class="form-group">
        <label>Color</label>
        <div id="color-picker" class="color-picker"></div>
      </div>
      <button id="btn-save-category" class="btn btn-primary btn-full">Save Category</button>
      <button id="btn-delete-category" class="btn btn-danger btn-full hidden">Delete Category</button>
    </div>

    <!-- Category Detail / Member Management -->
    <div id="view-category-detail" class="hidden">
      <div class="section-header">
        <button class="btn btn-back btn-back-detail">← Back</button>
        <span id="detail-category-name"></span>
        <button id="btn-edit-from-detail" class="btn btn-text">Edit</button>
      </div>
      <div id="member-list"></div>
    </div>

    <!-- Quick Add from Profile -->
    <div id="view-quick-add" class="hidden">
      <div class="qa-header">
        <div class="qa-profile">
          <span id="qa-profile-name" class="qa-name"></span>
          <span id="qa-profile-path" class="qa-path"></span>
        </div>
      </div>
      <div id="qa-belongs" class="qa-belongs hidden">
        Added to: <span></span>
      </div>
      <div class="section-header">
        <span>Select Category</span>
      </div>
      <div id="qa-category-list"></div>
      <div id="qa-skip" class="qa-skip">Skip, go to dashboard →</div>
    </div>

    <!-- AI Suggestions Review -->
    <div id="view-ai-review" class="hidden">
      <div class="section-header">
        <button class="btn btn-back btn-back-ai">← Back</button>
        <span>AI Suggestions</span>
        <span></span>
      </div>
      <div id="ai-status">
        <div class="loading-spinner"></div>
        <p id="ai-status-text">Analyzing your following list...</p>
      </div>
      <div id="ai-suggestions"></div>
      <button id="btn-confirm-ai" class="btn btn-primary btn-full hidden">Confirm & Save</button>
    </div>
  </div>

  <script src="../lib/storage.js"></script>
  <script src="popup.js"></script>
</body>
</html>
