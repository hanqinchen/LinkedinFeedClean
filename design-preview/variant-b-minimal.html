<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>设计变体 B - Minimalist 极简</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif;
      background: #f5f5f7;
      min-height: 100vh;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
    }

    .title {
      color: #1d1d1f;
      font-size: 24px;
      font-weight: 600;
      text-align: center;
    }

    .subtitle {
      color: #86868b;
      font-size: 14px;
      margin-top: 4px;
    }

    /* Popup 预览 */
    .popup-preview {
      width: 380px;
      height: 520px;
      background: #ffffff;
      border-radius: 20px;
      box-shadow:
        0 10px 40px rgba(0, 0, 0, 0.12),
        0 0 0 0.5px rgba(0, 0, 0, 0.06);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .popup-header {
      padding: 24px 24px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .popup-title {
      font-size: 20px;
      font-weight: 700;
      color: #1d1d1f;
      letter-spacing: -0.6px;
    }

    .btn-ai {
      background: #000;
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .btn-ai:hover {
      background: #333;
      transform: scale(1.02);
    }

    .section-header {
      padding: 16px 24px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .section-title {
      font-size: 13px;
      font-weight: 600;
      color: #86868b;
      letter-spacing: 0.5px;
    }

    .btn-new {
      background: #f5f5f7;
      color: #1d1d1f;
      border: none;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-new:hover {
      background: #e8e8ed;
    }

    .category-list {
      flex: 1;
      overflow-y: auto;
      padding: 0 20px;
    }

    .category-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px;
      background: #f5f5f7;
      border-radius: 16px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .category-item:hover {
      background: #e8e8ed;
    }

    .category-indicator {
      width: 6px;
      height: 36px;
      border-radius: 3px;
    }

    .category-info {
      flex: 1;
    }

    .category-name {
      font-size: 16px;
      font-weight: 600;
      color: #1d1d1f;
      letter-spacing: -0.4px;
    }

    .category-count {
      font-size: 13px;
      color: #86868b;
      margin-top: 3px;
    }

    .category-arrow {
      color: #c7c7cc;
      font-size: 16px;
      font-weight: 500;
    }

    /* 标签栏预览 */
    .filter-bar-preview {
      width: 600px;
      background: #ffffff;
      border-radius: 16px;
      padding: 8px;
      box-shadow:
        0 4px 20px rgba(0, 0, 0, 0.08),
        0 0 0 0.5px rgba(0, 0, 0, 0.04);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .filter-tab {
      padding: 12px 20px;
      border: none;
      background: transparent;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      color: #6e6e73;
      border-radius: 12px;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .filter-tab:hover {
      background: #f5f5f7;
      color: #1d1d1f;
    }

    .filter-tab.active {
      background: #000;
      color: #fff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    }

    .filter-manage {
      margin-left: auto;
      color: #86868b;
      font-size: 13px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 10px 14px;
    }

    .variant-label {
      background: #1d1d1f;
      color: #fff;
      padding: 10px 24px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="variant-label">变体 B - Minimalist 极简</div>

  <div>
    <div class="title">Popup 弹窗</div>
    <div class="subtitle">380 × 520px</div>
  </div>

  <div class="popup-preview">
    <div class="popup-header">
      <div class="popup-title">Feed Categorizer</div>
      <button class="btn-ai">✨ AI 智能分类</button>
    </div>

    <div class="section-header">
      <span class="section-title">我的分类</span>
      <button class="btn-new">+ 新建分类</button>
    </div>

    <div class="category-list">
      <div class="category-item">
        <div class="category-indicator" style="background: #007aff"></div>
        <div class="category-info">
          <div class="category-name">AI / 机器学习</div>
          <div class="category-count">12 位关注对象已分类</div>
        </div>
        <span class="category-arrow">⌘</span>
      </div>

      <div class="category-item">
        <div class="category-indicator" style="background: #ff2d55"></div>
        <div class="category-info">
          <div class="category-name">创业者</div>
          <div class="category-count">8 位关注对象已分类</div>
        </div>
        <span class="category-arrow">⌘</span>
      </div>

      <div class="category-item">
        <div class="category-indicator" style="background: #5856d6"></div>
        <div class="category-info">
          <div class="category-name">投资人</div>
          <div class="category-count">5 位关注对象已分类</div>
        </div>
        <span class="category-arrow">⌘</span>
      </div>

      <div class="category-item">
        <div class="category-indicator" style="background: #34c759"></div>
        <div class="category-info">
          <div class="category-name">设计师</div>
          <div class="category-count">6 位关注对象已分类</div>
        </div>
        <span class="category-arrow">⌘</span>
      </div>
    </div>
  </div>

  <div>
    <div class="title">信息流标签栏</div>
    <div class="subtitle">注入 LinkedIn 页面顶部</div>
  </div>

  <div class="filter-bar-preview">
    <button class="filter-tab active">全部</button>
    <button class="filter-tab">AI / 机器学习</button>
    <button class="filter-tab">创业者</button>
    <button class="filter-tab">投资人</button>
    <button class="filter-tab">设计师</button>
    <button class="filter-tab filter-manage">⚙️ 管理分类</button>
  </div>
</body>
</html>
