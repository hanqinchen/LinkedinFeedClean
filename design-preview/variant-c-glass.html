<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>设计变体 C - Glass 玻璃态</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif;
      background:
        radial-gradient(circle at 20% 20%, rgba(255, 182, 193, 0.4) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(173, 216, 230, 0.4) 0%, transparent 50%),
        radial-gradient(circle at 50% 50%, rgba(255, 228, 196, 0.3) 0%, transparent 50%),
        #fafafa;
      min-height: 100vh;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
    }

    .title {
      color: #1d1d1f;
      font-size: 24px;
      font-weight: 600;
      text-align: center;
    }

    .subtitle {
      color: #86868b;
      font-size: 14px;
      margin-top: 4px;
    }

    /* Popup 预览 */
    .popup-preview {
      width: 380px;
      height: 520px;
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border-radius: 24px;
      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.15),
        0 0 0 1px rgba(255, 255, 255, 0.5) inset;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .popup-header {
      padding: 22px 22px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.3);
      border-bottom: 1px solid rgba(0, 0, 0, 0.06);
    }

    .popup-title {
      font-size: 18px;
      font-weight: 700;
      color: #1d1d1f;
      letter-spacing: -0.5px;
    }

    .btn-ai {
      background: linear-gradient(135deg, #007AFF 0%, #5856D6 100%);
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(0, 122, 255, 0.3);
    }

    .btn-ai:hover {
      transform: translateY(-1px) scale(1.02);
      box-shadow: 0 6px 16px rgba(0, 122, 255, 0.4);
    }

    .section-header {
      padding: 18px 22px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .section-title {
      font-size: 12px;
      font-weight: 700;
      color: #86868b;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .btn-new {
      background: rgba(0, 122, 255, 0.1);
      color: #007AFF;
      border: none;
      padding: 8px 14px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-new:hover {
      background: rgba(0, 122, 255, 0.15);
    }

    .category-list {
      flex: 1;
      overflow-y: auto;
      padding: 0 16px;
    }

    .category-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px;
      background: rgba(255, 255, 255, 0.6);
      border-radius: 16px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      border: 1px solid rgba(255, 255, 255, 0.8);
    }

    .category-item:hover {
      background: rgba(255, 255, 255, 0.9);
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }

    .category-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .category-info {
      flex: 1;
    }

    .category-name {
      font-size: 15px;
      font-weight: 600;
      color: #1d1d1f;
      letter-spacing: -0.3px;
    }

    .category-count {
      font-size: 12px;
      color: #86868b;
      margin-top: 2px;
    }

    .category-badge {
      background: #007AFF;
      color: #fff;
      padding: 4px 10px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
    }

    /* 标签栏预览 */
    .filter-bar-preview {
      width: 600px;
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border-radius: 20px;
      padding: 10px;
      box-shadow:
        0 10px 40px rgba(0, 0, 0, 0.1),
        0 0 0 1px rgba(255, 255, 255, 0.5) inset;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .filter-tab {
      padding: 12px 22px;
      border: none;
      background: transparent;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      color: #6e6e73;
      border-radius: 14px;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .filter-tab:hover {
      background: rgba(0, 0, 0, 0.04);
      color: #1d1d1f;
    }

    .filter-tab.active {
      background: linear-gradient(135deg, #007AFF 0%, #5856D6 100%);
      color: #fff;
      box-shadow: 0 4px 12px rgba(0, 122, 255, 0.3);
    }

    .filter-manage {
      margin-left: auto;
      color: #86868b;
      font-size: 13px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .variant-label {
      background: rgba(0, 0, 0, 0.8);
      color: #fff;
      padding: 10px 24px;
      border-radius: 16px;
      font-size: 14px;
      font-weight: 600;
      backdrop-filter: blur(10px);
    }
  </style>
</head>
<body>
  <div class="variant-label">变体 C - Glass 玻璃态</div>

  <div>
    <div class="title">Popup 弹窗</div>
    <div class="subtitle">380 × 520px</div>
  </div>

  <div class="popup-preview">
    <div class="popup-header">
      <div class="popup-title">Feed Categorizer</div>
      <button class="btn-ai">✨ AI 智能分类</button>
    </div>

    <div class="section-header">
      <span class="section-title">分类</span>
      <button class="btn-new">+ 新建</button>
    </div>

    <div class="category-list">
      <div class="category-item">
        <div class="category-icon" style="background: linear-gradient(135deg, #007AFF20, #007AFF10)">🤖</div>
        <div class="category-info">
          <div class="category-name">AI / 机器学习</div>
          <div class="category-count">Andrej Karpathy, Yann LeCun 等</div>
        </div>
        <div class="category-badge">12</div>
      </div>

      <div class="category-item">
        <div class="category-icon" style="background: linear-gradient(135deg, #FF2D5520, #FF2D5510)">🚀</div>
        <div class="category-info">
          <div class="category-name">创业者</div>
          <div class="category-count">Paul Graham, Reid Hoffman 等</div>
        </div>
        <div class="category-badge">8</div>
      </div>

      <div class="category-item">
        <div class="category-icon" style="background: linear-gradient(135deg, #5856D620, #5856D610)">💰</div>
        <div class="category-info">
          <div class="category-name">投资人</div>
          <div class="category-count">5 位关注对象</div>
        </div>
        <div class="category-badge">5</div>
      </div>

      <div class="category-item">
        <div class="category-icon" style="background: linear-gradient(135deg, #34C75920, #34C75910)">🎨</div>
        <div class="category-info">
          <div class="category-name">设计师</div>
          <div class="category-count">6 位关注对象</div>
        </div>
        <div class="category-badge">6</div>
      </div>
    </div>
  </div>

  <div>
    <div class="title">信息流标签栏</div>
    <div class="subtitle">注入 LinkedIn 页面顶部</div>
  </div>

  <div class="filter-bar-preview">
    <button class="filter-tab active">全部</button>
    <button class="filter-tab">🤖 AI / 机器学习</button>
    <button class="filter-tab">🚀 创业者</button>
    <button class="filter-tab">💰 投资人</button>
    <button class="filter-tab">🎨 设计师</button>
    <button class="filter-tab filter-manage">⚙️ 管理</button>
  </div>
</body>
</html>
